# Managed by ForgeStudio - rewritten on every push from ForgeStudio.
#
# Flow (same shape as the ForgeStudio MCP server pipeline):
#   1. build-and-test - every push and pull request: build the SDK and run its tests.
#   2. publish-to-artifact-registry - only for a push to the default branch whose commit
#      changed .forgestudio/release.json (written by ForgeStudio's Publish action):
#      stamp the release's package name and version, publish to Artifact Registry.

name: SDK CI/CD

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Unlike the MCP deploy, a release is never cancelled half-way: a
# cancelled publish can leave a version partly uploaded.
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID:                 probestack-prod
  REGION:                     us-central1
  REPOSITORY:                 forgestudio-sdk-python
  SERVICE_ACCOUNT_EMAIL:      github-actions-forgecrux@probestack-prod.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  RELEASE_MANIFEST:           .forgestudio/release.json

jobs:
  # ───────────────────────────── 1. Test ─────────────────────────────
  test:
    name: build-and-test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r test-requirements.txt
          pip install .
          python -m pytest -q

      - name: Detect release request
        id: release
        run: |
          release=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]] \
            && git diff --name-only HEAD~1 HEAD | grep -qx "${RELEASE_MANIFEST}"; then
            release=true
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  # ──────────────── 2. Publish to Artifact Registry ────────────────
  publish:
    name: publish-to-artifact-registry
    needs: test
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ env.SERVICE_ACCOUNT_EMAIL }}
          token_format:               access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read release manifest
        run: |
          name=$(jq -er '.packageName' "${RELEASE_MANIFEST}")
          version=$(jq -er '.packageVersion' "${RELEASE_MANIFEST}")
          [[ "${name}" =~ ^[@a-z0-9._:/-]+$ ]] || { echo "::error::Invalid package name in ${RELEASE_MANIFEST}"; exit 1; }
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid package version in ${RELEASE_MANIFEST}"; exit 1; }
          echo "PACKAGE_NAME=${name}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${REPOSITORY}" --location="${REGION}" --project="${PROJECT_ID}" > /dev/null 2>&1; then
            gcloud artifacts repositories create "${REPOSITORY}" --repository-format=python \
              --location="${REGION}" --project="${PROJECT_ID}" --description="ForgeStudio generated SDKs" \
              || { echo "::error::Artifact Registry repository ${REPOSITORY} does not exist and ${SERVICE_ACCOUNT_EMAIL} cannot create it."; exit 1; }
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package name and version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          setup = pathlib.Path("setup.py")
          text, names = re.subn(r'(?m)^NAME = ".*"$', f'NAME = "{os.environ["PACKAGE_NAME"]}"', setup.read_text())
          text, versions = re.subn(r'(?m)^VERSION = ".*"$', f'VERSION = "{os.environ["PACKAGE_VERSION"]}"', text)
          if names != 1 or versions != 1:
              raise SystemExit("setup.py has no NAME / VERSION constants to stamp")
          setup.write_text(text)
          PY

      - name: Build and publish Python package
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine upload --non-interactive \
            --repository-url "https://${REGION}-python.pkg.dev/${PROJECT_ID}/${REPOSITORY}/" \
            -u oauth2accesstoken -p "${ACCESS_TOKEN}" dist/*

      - name: Write release summary
        run: |
          {
            echo "## SDK published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Package**  | \`${PACKAGE_NAME}\` |"
            echo "| **Version**  | \`${PACKAGE_VERSION}\` |"
            echo "| **Registry** | \`${REGION}/${PROJECT_ID}/${REPOSITORY}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
